name: Bootstrap Storefront Lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/public-lead-intake'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate lockfile and finalize deterministic CI
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; nothing to bootstrap"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''      - name: Install dependencies
                run: npm install --no-audit --no-fund
              - name: Capture bootstrap lockfile
                uses: actions/upload-artifact@v4
                with:
                  name: bootstrap-package-lock
                  path: package-lock.json
                  if-no-files-found: error
                  retention-days: 1
          '''
          new = '''      - name: Install dependencies
                run: npm ci --no-audit --no-fund
          '''
          if old not in text:
              raise SystemExit('Expected bootstrap install block was not found in ci.yml')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/bootstrap-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(web): pin deterministic dependencies"
          git push origin HEAD:${{ github.head_ref }}
