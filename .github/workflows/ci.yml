name: Storefront CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Foundation contract smoke
        run: npm run foundation:smoke
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Public performance regression gate
        run: npm run perf:ci
      - name: Print Lighthouse diagnostics
        if: always()
        run: node scripts/perf-lighthouse-diagnostics.mjs
      - name: Retain Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
