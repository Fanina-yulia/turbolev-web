name: Storefront CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Foundation contract smoke
        run: npm run foundation:smoke
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture bootstrap lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/turbolev-web.log 2>&1 &
          echo $! > /tmp/turbolev-web.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/turbolev-web.log
          exit 1
      - name: Public performance regression gate
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
        run: npm run perf:gate
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-002-lighthouse-reports
          path: .lighthouseci/perf-002/*.json
          if-no-files-found: warn
          retention-days: 14
