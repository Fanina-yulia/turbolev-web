name: Storefront CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Foundation contract smoke
        run: npm run foundation:smoke
      - name: SEO contract smoke
        run: npm run seo:smoke
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture bootstrap lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
